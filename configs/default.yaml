# Default experiment: SmolLM2-1.7B-Instruct, steer at the midpoint, read 6 layers later.
model:
  id: HuggingFaceTB/SmolLM2-1.7B-Instruct
  dtype: auto          # bfloat16 on CUDA, float32 otherwise
  device: auto

data:
  pairs: data/contrastive_pairs.jsonl        # all 50 train the vector
  holdout_pairs: data/holdout_pairs.jsonl    # 100 never-seen pairs: 60 standard + 40 style-swapped
  holdout_fraction: 0.2   # only used if holdout_pairs is removed (then pairs is split per domain)
  seed: 42

extraction:
  batch_size: 8

steering:
  layer: 12            # output of decoder block 12 (0-based) is steered
  readout_layer: 18    # read later, so explanations show the effect propagating
  scale_fraction: 0.2  # alpha = 1 adds 20% of a typical token norm at the steering layer
  positions: all       # or "generated" to leave the prompt untouched

generation:
  max_new_tokens: 90
  batch_size: 8
  temperature: 0.7
  top_p: 0.9
  seed: 1234

judge:
  backend: auto        # anthropic if ANTHROPIC_API_KEY is set, else a separate HF model; "none" to skip
  anthropic_model: claude-haiku-5-5
  hf_model: Qwen/Qwen2.5-7B-Instruct   # Qwen/Qwen2.5-3B-Instruct if memory is tight
  hf_dtype: half                       # ~15 GB for a 7B judge instead of ~30 GB
  cache: true

eval:
  alphas: [-1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5]
  max_new_tokens: 75
  include_holdout: true
  holdout_limit: 40    # generate for 40 of the 100 held-out prompts (balanced by style) to keep runs short; null = all
  user_correct_file: data/user_correct_prompts.jsonl   # 40 prompts where the user is RIGHT (over-correction check)
  user_correct_limit: 20
  random_control_alphas: [-1.5, 1.5]   # same strengths along a random direction
  random_seed: 0
  fluency: true                        # perplexity + repetition per reply
  prompts_file: null   # e.g. examples/my_prompts.txt to add your own prompts

output_dir: runs
